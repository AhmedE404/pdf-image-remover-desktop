name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger release on version tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build Application
      run: |
        python build_app.py

    - name: Upload Windows Portable Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Image-Remover-Portable
        path: "dist/PDF Image Remover Portable.exe"

    - name: Upload Windows Standard Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Image-Remover-Standard
        path: "dist/PDF Image Remover-Windows-Standard.zip"

    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Image-Remover-macOS
        path: "dist/PDF Image Remover-macOS.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_assets
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        body: |
          ### 🚀 Installation & Troubleshooting
          
          Because this is a free open-source app, your OS might show a security warning. Here is how to safely bypass it:
          
          #### 🍏 macOS ("App cannot be opened" or "Unverified Developer")
          1. **DO NOT double-click the app.**
          2. **Right-click (or Control-click)** the app icon and select **Open**.
          3. Click the new **Open** button in the warning dialog.
          *(Alternatively, run `xattr -cr "/path/to/PDF Image Remover.app"` in Terminal)*
          
          #### 🪟 Windows ("Windows protected your PC")
          Because the app is unsigned, Windows Defender SmartScreen will block it. 
          * Whether you downloaded the **Portable (.exe)** or the **Standard (.zip)**, click **More Info -> Run Anyway** when the blue screen appears.
        files: |
          release_assets/*.exe
          release_assets/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}